[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-flow-local"
version = "0.1.0"
description = "Pipeline local de preparação, aprovação e entrega de mídias do Flow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["openpyxl>=3.1", "pytest>=8", "ruff>=0.8"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  "entregas_flow",
  "preparados",
  "referencia_gflow_original",
  "entradas/backups",
]
