[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-flow-local"
version = "0.1.0"
description = "Pipeline local de preparação, aprovação e entrega de mídias do Flow"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.115",
  "gflow-cli==0.74.0",
  "openpyxl>=3.1",
  "Pillow>=10",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts", "src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  "entregas_flow",
  "preparados",
  "referencia_gflow_original",
  "entradas/backups",
]
